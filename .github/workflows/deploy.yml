# Zet de boekingsmodule via FTP op de webserver bij elke push naar main.
# Benodigde repository secrets (Settings > Secrets and variables > Actions):
#   FTP_SERVER      bijv. ftp.villaroccaccia.com
#   FTP_USERNAME
#   FTP_PASSWORD
#   FTP_SERVER_DIR  map van de boekingsmodule op de server, met / op het eind,
#                   bijv. /public_html/boeken/ (de map naast wp-config.php's map)
# Optioneel als repository variable (tabblad "Variables"):
#   FTP_PROTOCOL    ftps (standaard), ftp of ftps-legacy
name: Uitrollen via FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Bestanden uploaden
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
